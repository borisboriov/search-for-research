[project]
name = "sfr-api"
version = "0.1.0"
description = "Search For Research match API: open supervisor cards over the SFR-1 index"
requires-python = ">=3.12"
dependencies = [
    "sfr-core",
    "sfr-match",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sfr_api"]
