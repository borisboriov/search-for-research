repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy packages/sfr-core/src/sfr_core packages/sfr-etl/src/sfr_etl
        language: system
        types: [python]
        pass_filenames: false
      - id: gitleaks
        name: gitleaks (staged)
        entry: security/gitleaks-precommit.sh
        language: script
        pass_filenames: false
