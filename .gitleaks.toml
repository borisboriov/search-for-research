# gitleaks — конфиг сканера секретов (SFR-4b).
#
# База — правила по умолчанию; ниже только исключения. Каждое исключение имеет
# причину и дату пересмотра: «выключить правило целиком» запрещено спекой,
# исключается конкретный путь или конкретная строка.

title = "Search For Research"

[extend]
useDefault = true

# --- Каталоги, которых нет в git ------------------------------------------
# gitleaks dir идёт по файловой системе и не знает про .gitignore: без этого
# он сканирует .venv, node_modules и кэш моделей — полгигабайта чужого кода,
# три минуты и находки в чужих тестовых фикстурах.
[[allowlists]]
description = "Артефакты сборки и окружения (в git не попадают)"
paths = [
    '''(^|/)\.venv/''',
    '''(^|/)node_modules/''',
    '''(^|/)\.next/''',
    '''(^|/)data/''',
    '''(^|/)\.git/''',
    '''(^|/)\.mypy_cache/''',
    '''(^|/)\.ruff_cache/''',
    '''(^|/)\.pytest_cache/''',
    '''(^|/)_to_delete/''',
    '''(^|/)\.idea/''',
    '''(^|/)e2e/screenshots/''',
    '''(^|/)\.audit-[^/]+/''',
]

# --- Единственный файл, где секреты лежать ДОЛЖНЫ -------------------------
# `.env` — назначенное хранилище секретов проекта (CLAUDE.md: «секреты только
# через env, .env в gitignore»). Режим `dir` идёт по файловой системе и не
# знает про .gitignore, поэтому находит там ровно то, что там и обязано быть:
# первый же настоящий ключ (OPENALEX_API_KEY, 05.09) сделал аудит красным.
# Защиту это не ослабляет: закоммитить `.env` нельзя (`.gitignore:153`), а
# режим `git` — тот, что ловит реальные утечки, — сканирует всё без исключений,
# и поверх него работает GitHub Push Protection.
# `.env.example` под исключение НЕ подпадает намеренно: он лежит в git, и
# настоящий секрет в нём — это уже утечка, которую надо ловить.
[[allowlists]]
description = "Локальный .env — назначенное место для секретов, в git не попадает"
paths = ['''(^|/)\.env$''']

# Исключения для security/semgrep/*.yaml здесь сознательно НЕТ. Пак p/secrets
# из вендоринга убран именно потому, что состоит из секрето-подобных строк:
# GitHub Push Protection отклоняет пуш с ним, а исключение в gitleaks только
# спрятало бы это до момента пуша. Если обновление правил принесёт такой файл
# снова — пусть `make audit` станет красным сразу (docs/SFR4b_REPORT.md).
