[project]
name = "sfr-match"
version = "0.1.0"
description = "Search For Research matching: embedding index, semantic search, evaluation harness"
requires-python = ">=3.12"
dependencies = [
    "sfr-core",
    "numpy>=1.26",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "typer>=0.12",
    "structlog>=24.4",
]

[project.scripts]
sfr-match = "sfr_match.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sfr_match"]
