[project]
name = "sfr-core"
version = "0.1.0"
description = "Search For Research domain core: SQLAlchemy models, settings, export schemas"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "alembic>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sfr_core"]
