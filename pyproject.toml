# Workspace root (virtual project — no build-system, not installable itself).
[project]
name = "search-for-research"
version = "0.1.0"
description = "Search For Research — cross-university research supervisor matching (SFR-0: monorepo foundation + OpenAlex ETL)"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/sfr-core", "packages/sfr-etl"]

[tool.uv.sources]
sfr-core = { workspace = true }
sfr-etl = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "pre-commit>=3.8",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["sfr_core", "sfr_etl"]

# ---------------------------------------------------------------------------
# Mypy: strict for sfr_core, basic for sfr_etl (per SPEC §2)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = ["packages/sfr-core/src", "packages/sfr-etl/src"]
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "sfr_core.*"
strict = true

# ---------------------------------------------------------------------------
# Pytest + coverage (threshold per SPEC §5: pure logic >= 80%)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["packages/sfr-core/tests", "packages/sfr-etl/tests"]
addopts = "--cov=sfr_core --cov=sfr_etl --cov-report=term-missing --cov-fail-under=80"
markers = [
    "integration: live OpenAlex API smoke tests (excluded in CI)",
]

[tool.coverage.run]
# CLI wiring and alembic migrations are excluded from the coverage target (SPEC §5).
omit = [
    "*/sfr_etl/cli.py",
    "*/alembic/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
