# Workspace root (virtual project — no build-system, not installable itself).
[project]
name = "search-for-research"
version = "0.1.0"
description = "Search For Research — cross-university research supervisor matching (SFR-0: monorepo foundation + OpenAlex ETL)"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/sfr-core", "packages/sfr-etl", "packages/sfr-match", "apps/api"]

# torch drags CUDA wheels (gigabytes) on Linux, and the deploy target is a CPU-only
# VPS. The CPU index is used on Linux only; macOS keeps the PyPI build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
sfr-core = { workspace = true }
sfr-etl = { workspace = true }
sfr-match = { workspace = true }
sfr-api = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6",
    "httpx>=0.27",  # fastapi TestClient
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "pre-commit>=3.8",
]
# SFR-4b. Версии запинены точно: аудит должен быть воспроизводим, а обновление
# сканера — осознанным шагом (новая версия приносит новые правила и новые
# находки). Группа не входит в default-groups: `make test`/CI-job checks её не
# ставят, она нужна только `make audit` и job security.
security = [
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "semgrep==1.176.1",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
]
# Bilingual (ru/en) project: Cyrillic in literals, comments and docstrings is intentional.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["sfr_core", "sfr_etl", "sfr_match", "sfr_api"]

# ---------------------------------------------------------------------------
# Mypy: strict for sfr_core, basic for sfr_etl (per SPEC §2)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = [
    "packages/sfr-core/src",
    "packages/sfr-etl/src",
    "packages/sfr-match/src",
    "apps/api/src",
]
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "sfr_core.*"
strict = true

# rank-bm25 ships no py.typed marker.
[[tool.mypy.overrides]]
module = "rank_bm25.*"
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest + coverage (threshold per SPEC §5: pure logic >= 80%)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = [
    "packages/sfr-core/tests",
    "packages/sfr-etl/tests",
    "packages/sfr-match/tests",
    "apps/api/tests",
]
addopts = "--cov=sfr_core --cov=sfr_etl --cov=sfr_match --cov=sfr_api --cov-report=term-missing --cov-fail-under=80"
markers = [
    "integration: live OpenAlex API smoke tests (excluded in CI)",
    "slow: downloads/runs a real embedding model (excluded in CI)",
]

[tool.coverage.run]
# CLI wiring and alembic migrations are excluded from the coverage target (SPEC §5).
omit = [
    "*/sfr_etl/cli.py",
    "*/sfr_match/cli.py",
    "*/alembic/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
