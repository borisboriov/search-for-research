# Боевая компоновка Search For Research (SFR-4 §1): api + web + proxy.
#
# Наружу опубликован только proxy (80/443). API из интернета недостижим:
# у контейнера api нет ports, клиентские запросы идут браузер -> proxy ->
# web (Next route handler) -> api по внутренней сети compose.
#
# Артефакты НЕ собираются на сервере — их привозит deploy/sync-artifacts.sh:
#   data/indexes_sfr5c/            индекс (make index-sfr5c, офлайн)
#   data/exports/cards_sfr5c.jsonl обогащение карточек (make export-sfr5c)
# Веса FRIDA качаются в том hf-cache при первом старте (~2 ГБ, единожды).
#
# Переменные — из deploy/.env (cp env.example .env): SITE_ADDRESS,
# NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_CLAIM_EMAIL, REVALIDATE_SECRET,
# SFR_API_LOG_SALT. Локальная репетиция — make deploy-local (см. Makefile).

name: ${SFR_COMPOSE_PROJECT:-sfr-deploy}

services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: ${SFR_COMPOSE_PROJECT:-sfr-deploy}-api:latest
    container_name: ${SFR_COMPOSE_PROJECT:-sfr}-api
    restart: unless-stopped
    environment:
      SFR_API_MODEL: ${SFR_API_MODEL:-frida}
      SFR_API_INDEX_ROOT: /app/data/indexes_sfr5c
      SFR_API_CARDS_PATH: /app/data/exports/cards_sfr5c.jsonl
      # Пороги не задаём: значения по умолчанию живут в settings.py
      # (перекалиброваны при выкладке SFR-5c), дублировать их здесь — рассинхрон.
      SFR_SEARCH_BACKEND: ${SFR_SEARCH_BACKEND:-auto}
      SFR_API_LOG_SALT: ${SFR_API_LOG_SALT:-}
      TZ: UTC
      SFR_API_ANALYTICS_DATABASE_URL: ${SFR_API_ANALYTICS_DATABASE_URL:-postgresql+psycopg://sfr_runtime:${SFR_ANALYTICS_RUNTIME_PASSWORD:?set runtime password}@postgres:5432/sfr_analytics}
      SFR_API_ANALYTICS_SPOOL_DIR: /analytics/spool
      SFR_API_ANALYTICS_RELEASE: ${SFR_ANALYTICS_RELEASE:-unknown}
      # Only Next has this fixed internal address. Caddy replaces inbound XFF.
      SFR_API_ANALYTICS_TRUSTED_PROXY_CIDRS: '["${SFR_COMPOSE_WEB_IP:-172.29.162.3}/32"]'
      HF_HOME: /models
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
    volumes:
      - ../data/indexes_sfr5c:/app/data/indexes_sfr5c:ro
      # Только карточки, не весь data/exports (#13): профили с полными
      # текстами (~40–60 МБ) сервису не нужны. create_host_path: false — без
      # файла контейнер не поднимется, а не получит пустой каталог на его месте.
      - type: bind
        source: ../data/exports/cards_sfr5c.jsonl
        target: /app/data/exports/cards_sfr5c.jsonl
        read_only: true
        bind:
          create_host_path: false
      - ${SFR_HF_CACHE:-hf-cache}:/models
      - analytics-journal:/analytics
    networks:
      analytics:
    logging: &logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?задай в deploy/.env — канонический адрес сайта}
        NEXT_PUBLIC_SFR_RELEASE: ${SFR_ANALYTICS_RELEASE:-unknown}
        NEXT_PUBLIC_CLAIM_EMAIL: ${NEXT_PUBLIC_CLAIM_EMAIL:-}
    image: ${SFR_COMPOSE_PROJECT:-sfr-deploy}-web:latest
    container_name: ${SFR_COMPOSE_PROJECT:-sfr}-web
    restart: unless-stopped
    environment:
      TZ: UTC
      SFR_API_URL: http://api:8000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      SFR_TRUST_PROXY: "1"
      SFR_ANALYTICS_RELEASE: ${SFR_ANALYTICS_RELEASE:-unknown}
    networks:
      analytics:
        ipv4_address: ${SFR_COMPOSE_WEB_IP:-172.29.162.3}
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  proxy:
    build:
      context: proxy
    image: ${SFR_COMPOSE_PROJECT:-sfr-deploy}-proxy:latest
    container_name: ${SFR_COMPOSE_PROJECT:-sfr}-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TZ: UTC
      SITE_ADDRESS: ${SITE_ADDRESS:?задай в deploy/.env — домен или http://localhost:8080}
      # 301 второго имени на канонический адрес (#21); пусто — блок редиректа
      # слушает неопубликованный localhost:8081 и ни на что не влияет.
      REDIRECT_FROM: ${REDIRECT_FROM:-http://localhost:8081}
      REDIRECT_TO: ${REDIRECT_TO:-http://localhost:8080}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      analytics:
    healthcheck:
      # admin-endpoint Caddy слушает 127.0.0.1:2019 внутри контейнера
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *logging

  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    shm_size: 128m
    environment:
      TZ: UTC
      PGTZ: UTC
      POSTGRES_DB: sfr_analytics
      POSTGRES_USER: sfr_migrator
      POSTGRES_PASSWORD: ${SFR_ANALYTICS_MIGRATION_PASSWORD:?set migration password}
      SFR_ANALYTICS_RUNTIME_PASSWORD: ${SFR_ANALYTICS_RUNTIME_PASSWORD:?set runtime password}
      SFR_ANALYTICS_READER_PASSWORD: ${SFR_ANALYTICS_READER_PASSWORD:?set reader password}
    command: ["postgres", "-c", "timezone=UTC", "-c", "max_connections=20",
              "-c", "shared_buffers=64MB", "-c", "work_mem=4MB",
              "-c", "maintenance_work_mem=32MB", "-c", "statement_timeout=5s",
              "-c", "idle_in_transaction_session_timeout=10s", "-c", "log_statement=none",
              "-c", "log_min_error_statement=panic", "-c", "log_parameter_max_length_on_error=0"]
    volumes:
      - analytics-db:/var/lib/postgresql/data
      - ./postgres/init-runtime.sh:/docker-entrypoint-initdb.d/10-runtime.sh:ro
    networks:
      analytics:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfr_migrator -d sfr_analytics"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  analytics-migrate:
    profiles: ["operator"]
    image: ${SFR_COMPOSE_PROJECT:-sfr-deploy}-api:latest
    entrypoint: ["python", "-m", "sfr_api.analytics.migrate", "--runtime-role", "sfr_runtime", "--reader-role", "sfr_reader"]
    environment:
      TZ: UTC
      SFR_ANALYTICS_MIGRATION_DATABASE_URL: ${SFR_ANALYTICS_MIGRATION_DATABASE_URL:-postgresql+psycopg://sfr_migrator:${SFR_ANALYTICS_MIGRATION_PASSWORD:?set migration password}@postgres:5432/sfr_analytics}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      analytics:

  analytics-operator:
    profiles: ["operator"]
    image: ${SFR_COMPOSE_PROJECT:-sfr-deploy}-api:latest
    entrypoint: ["python", "/app/scripts/analytics.py"]
    environment:
      TZ: UTC
      SFR_ANALYTICS_OPERATOR_DATABASE_URL: ${SFR_ANALYTICS_OPERATOR_DATABASE_URL:-postgresql+psycopg://sfr_reader:${SFR_ANALYTICS_READER_PASSWORD:?set reader password}@postgres:5432/sfr_analytics}
      SFR_API_ANALYTICS_DATABASE_URL: ${SFR_API_ANALYTICS_DATABASE_URL:-postgresql+psycopg://sfr_runtime:${SFR_ANALYTICS_RUNTIME_PASSWORD:?set runtime password}@postgres:5432/sfr_analytics}
      SFR_API_ANALYTICS_SPOOL_DIR: /analytics/spool
    volumes:
      - analytics-journal:/analytics
      - ../data/analytics:/output
    networks:
      analytics:

networks:
  analytics:
    ipam:
      config:
        - subnet: ${SFR_COMPOSE_SUBNET:-172.29.162.0/24}

volumes:
  analytics-db:
  analytics-journal:
  hf-cache:
  caddy-data:
  caddy-config:
