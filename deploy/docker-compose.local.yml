# Локальная репетиция деплоя (make deploy-local): та же компоновка, но без
# TLS и без привилегированных портов — прокси слушает http://localhost:8080.
# `!override` заменяет список портов базового файла, а не дополняет его
# (иначе compose попытался бы занять и 80/443).
services:
  proxy:
    ports: !override
      - "8080:8080"
