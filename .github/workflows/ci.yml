name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # --locked: CI обязан падать, если uv.lock разошёлся с pyproject —
        # иначе зелёный CI при красном Docker-билде (--frozen) (REVIEW_SFR3).
        run: uv sync --locked --all-packages

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test
        run: make test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # Сборка должна проходить без живого API: страницы деградируют, не падают.
      # NEXT_PUBLIC_SITE_URL обязателен на прод-билде (next.config падает без
      # него); CI-артефакт никуда не деплоится, поэтому значение — заглушка.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://ci.search-for-research.invalid
