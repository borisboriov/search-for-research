name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: sfr_migrator
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: sfr_analytics
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sfr_migrator -d sfr_analytics"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SFR_ANALYTICS_TEST_DATABASE_URL: postgresql+psycopg://sfr_migrator:ci-only@127.0.0.1:5432/sfr_analytics
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # --locked: CI обязан падать, если uv.lock разошёлся с pyproject —
        # иначе зелёный CI при красном Docker-билде (--frozen) (REVIEW_SFR3).
        run: uv sync --locked --all-packages

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test
        run: make test

      - name: Real PostgreSQL migrations and durability
        run: make analytics-test-postgres

      - name: Docs check
        # Живые документы согласованы: пути, бриф против метрик и ApiSettings.
        # meta.json индекса в CI нет — эта локальная сверка пропускается.
        run: make docs-check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # Сборка должна проходить без живого API: страницы деградируют, не падают.
      # NEXT_PUBLIC_SITE_URL обязателен на прод-билде (next.config падает без
      # него); CI-артефакт никуда не деплоится, поэтому значение — заглушка.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://ci.search-for-research.invalid
